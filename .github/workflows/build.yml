name: Build Katarsis APK

on:
  push:
    branches: [ axgram, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm yasm patch

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ' '

      - name: Install NDK 27.3.13750724
        run: |
          yes | sdkmanager --install "ndk;27.3.13750724" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Restore Native Libraries
        run: |
          rm -rf TMessagesProj/jni/boringssl
          rm -rf TMessagesProj/jni/ffmpeg
          rm -rf TMessagesProj/jni/libvpx

          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          git clone --depth 1 https://github.com/google/boringssl.git TMessagesProj/jni/boringssl
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git TMessagesProj/jni/ffmpeg
          git clone --depth 1 https://github.com/webmproject/libvpx.git TMessagesProj/jni/libvpx
          
          cd TMessagesProj/jni/boringssl && git checkout fips-20220613 || true
          cd ../ffmpeg && git checkout release/4.4 || true

      - name: Create dummy libs for Debug build
        run: |
          mkdir -p TMessagesProj/jni/ffmpeg/arm64-v8a
          mkdir -p TMessagesProj/jni/ffmpeg/armeabi-v7a
          mkdir -p TMessagesProj/jni/libvpx/arm64-v8a
          mkdir -p TMessagesProj/jni/libvpx/armeabi-v7a

          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libswscale.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libswresample.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libavcodec.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libavformat.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libavutil.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libavfilter.a
          touch TMessagesProj/jni/ffmpeg/arm64-v8a/libavdevice.a
          
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libswscale.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libswresample.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libavcodec.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libavformat.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libavutil.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libavfilter.a
          touch TMessagesProj/jni/ffmpeg/armeabi-v7a/libavdevice.a

          touch TMessagesProj/jni/libvpx/arm64-v8a/libvpx.a
          touch TMessagesProj/jni/libvpx/armeabi-v7a/libvpx.a

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF

      - name: Build debug APK
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724
          ANDROID_NDK: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.3.13750724

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: katarsis-apk
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          retention-days: 30
