name: Build Katarsis APK

on:
  push:
    branches: [ axgram, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make nasm yasm patch

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.3.13750724
        run: |
          yes | sdkmanager --install "ndk;27.3.13750724" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          TELEGRAM_APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH=${{ secrets.TELEGRAM_APP_HASH }}
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF

      - name: Build debug APK
        run: ./gradlew :TMessagesProj:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: katarsis-apk
          path: TMessagesProj/build/outputs/apk/debug/*.apk
          retention-days: 30
